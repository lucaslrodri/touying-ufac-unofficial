name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this workflow as a gate before publishing
  workflow_call:

permissions:
  contents: read

jobs:
  tytanic:
    # Tytanic bundles its own compiler: 0.4.x is Typst 0.15.x, the version the reference images were rendered with.
    name: Tytanic 0.4.1 (Typst 0.15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache fonts
        uses: actions/cache@v6
        with:
          path: fonts
          key: newcomputermodern-1

      # The suite needs New Computer Modern Sans, which Typst does not bundle. No system fonts: only fonts/ and the
      # ones embedded in Tytanic, so the result does not depend on the runner image.
      - name: Download fonts
        run: sh scripts/fonts.sh

      # The template, the example decks and the tests that include them import `@preview/touying-ufac-unofficial:<version>`,
      # which scripts/with-preview.sh links to this checkout with gotpm (`gotpm install -e -n preview`, in a package
      # folder of the run); its version is pinned here.
      - name: Install gotpm
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/npikall/gotpm/releases/download/v0.8.0/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Tytanic
        uses: typst-community/setup-tytanic@v1
        with:
          tytanic-version: 0.4.1

      - name: Run test suite
        run: sh scripts/with-preview.sh tt run --font-path fonts --no-fail-fast

      # Not under act: its artifact server does not speak the protocol of upload-artifact v6+ (act 0.2.89).
      - name: Archive test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() && !env.ACT }}
        with:
          name: tytanic-results
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5

  minimum-compiler:
    # `compiler` in typst.toml promises that the package works from that Typst version on: compile with it the template,
    # the example decks and docs/readme/gallery.typ, which has the shorthands the example decks do not use.
    name: Decks on the minimum Typst version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache fonts
        uses: actions/cache@v6
        with:
          path: fonts
          key: newcomputermodern-1

      - name: Download fonts
        run: sh scripts/fonts.sh

      # The template, the example decks and the tests that include them import `@preview/touying-ufac-unofficial:<version>`,
      # which scripts/with-preview.sh links to this checkout with gotpm (`gotpm install -e -n preview`, in a package
      # folder of the run); its version is pinned here.
      - name: Install gotpm
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/npikall/gotpm/releases/download/v0.8.0/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Read the minimum version
        id: manifest
        run: echo "compiler=$(sed -n 's/^compiler *= *"\(.*\)"/\1/p' typst.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.manifest.outputs.compiler }}

      - name: Compile the template and the example decks
        run: |
          typst --version
          for deck in template/main.typ example/*.typ docs/readme/gallery.typ; do
            sh scripts/with-preview.sh typst compile --font-path fonts --ignore-system-fonts "$deck" /tmp/deck.pdf
          done

      # The errors raised when the deck is laid out, which `catch` in tests/unit/api cannot reach.
      - name: Check the error messages
        run: sh scripts/errors.sh
