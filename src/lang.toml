output = "Output"
thanks = "Thank you!"
and = "and"
months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
date = "{month} {day}, {year}"
instructors = "Instructors"
tcc = "Undergraduate Thesis"
dissertation = "Master's Dissertation"
thesis = "Doctoral Thesis"

[lang.en.bar]
